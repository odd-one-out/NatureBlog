{% extends "base.html" %}
{% load static %}



{% block content %}
<div class="col-lg-8 col-12 mx-auto">
    <div class="card p-3">
        <form method="post">
            {% csrf_token %}   
            <p class="fs-4 mb-3">Are you sure you want to delete "{{ object }}" ?</p>
            <input type="submit" class="btn btn-primary" value="Confirm">
            <a href="{% url "blog:profile" %}" class="btn btn-primary ms-2">Cancel</a>
        </form>
    </div>
</div>
{% endblock content %}
