{% extends "base.html" %}
{% load static %}


{% block content %}
    <div class="container regform">
        <h3>Log in</h3>
        <form method="post" action="{% url "blog:login" %}">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}"/>
            {% for field in form %}
            <div class="my-4">
            {{ field.errors }}
            {{ field.label_tag }} {{ field }}
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary">Log in</button>
        </form>
        <div class='mt-3'>Haven't got an account yet? <a href="{% url "blog:register" %}">Register</a></div>
    </div>
{% endblock content %}
