{% extends "base.html" %}
{% load static %}


{% block content %}
    <div class="col-12">
        <h4 class="my-3 text-center">{{ name }} - {{ posts|length }} posts</h4>
        <div class="row">
            {% for post in posts %}
                {% include "card.html" %}
            {% empty %}
                <h4 class="text-center">{{ empty_text }}</h4>
            {% endfor %}
        </div>
    </div>
{% endblock content %}
